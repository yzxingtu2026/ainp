name: Release Images

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    outputs:
      build_time: ${{ steps.identity.outputs.build_time }}
      short_sha: ${{ steps.identity.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --points-at HEAD | grep -Fx "${GITHUB_REF_NAME}"
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '[.check_runs[] | select((.name == "backend" or .name == "containers" or .name == "frontend" or .name == "repository-gates") and .conclusion == "success") | .name] | unique | sort | if . == ["backend", "containers", "frontend", "repository-gates"] then "success" else "failure" end')"
          test "$conclusion" = success
      - id: identity
        name: Resolve build identity
        run: |
          echo "build_time=$(git show -s --format=%cI HEAD | xargs -I{} date -u -d {} +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ainp-${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=sha-${{ needs.validate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.validate.outputs.build_time }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ needs.validate.outputs.build_time }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record immutable digest
        run: echo "${{ matrix.image }} ghcr.io/${{ github.repository_owner }}/ainp-${{ matrix.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
