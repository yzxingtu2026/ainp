name: Release Images

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    outputs:
      already_published: ${{ steps.release-state.outputs.already_published }}
      build_time: ${{ steps.identity.outputs.build_time }}
      short_sha: ${{ steps.identity.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --points-at HEAD | grep -Fx "${GITHUB_REF_NAME}"
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '[.check_runs[] | select((.name == "backend" or .name == "containers" or .name == "frontend" or .name == "repository-gates") and .conclusion == "success") | .name] | unique | sort | if . == ["backend", "containers", "frontend", "repository-gates"] then "success" else "failure" end')"
          test "$conclusion" = success
      - id: release-state
        name: Check immutable published state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=false
          if state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null)" && [ "$state" = false ]; then
            published=true
          fi
          echo "already_published=$published" >> "$GITHUB_OUTPUT"
      - id: identity
        name: Resolve build identity
        run: |
          echo "build_time=$(git show -s --format=%cI HEAD | xargs -I{} date -u -d {} +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    if: needs.validate.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ainp-${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=sha-${{ needs.validate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.validate.outputs.build_time }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ needs.validate.outputs.build_time }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record immutable digest
        run: |
          mkdir -p release-digests
          echo "${{ matrix.image }} ghcr.io/${{ github.repository_owner }}/ainp-${{ matrix.image }}@${{ steps.build.outputs.digest }}" | tee "release-digests/${{ matrix.image }}.digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: release-digests/${{ matrix.image }}.digest
          if-no-files-found: error

  draft-release:
    needs: [validate, build]
    if: needs.validate.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: release-digests
          merge-multiple: true
      - id: release
        name: Create or update Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null)" && [ "$state" = false ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Release is already published; rerun will not mutate or redeploy it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"
          previous="$(git tag --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | grep -Fxv "${GITHUB_REF_NAME}" | head -1 || true)"
          if [ -n "$previous" ]; then
            changes="$(git log --first-parent --pretty='- %s (%h)' "${previous}..HEAD")"
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
          else
            changes="$(git log --first-parent --max-count=100 --pretty='- %s (%h)' HEAD)"
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          fi
          mkdir -p release-assets
          cp deploy/demo/compose.yaml deploy/demo/config.yaml deploy/demo/deploy-demo.sh deploy/demo/.env.example release-assets/
          cat > release-notes.md <<EOF
          # ${GITHUB_REF_NAME}

          ## 变更

          ${changes}

          ## 镜像

          $(cat release-digests/*.digest)

          Commit: ${GITHUB_SHA}<br>
          Build time: ${{ needs.validate.outputs.build_time }}<br>
          Compare: ${compare}

          > 当前为确定性发布说明；AI 增强失败或未配置时发布流程继续使用本内容。
          EOF
          cp release-digests/*.digest release-assets/
          (cd release-assets && sha256sum .env.example backend.digest compose.yaml config.yaml deploy-demo.sh web.digest > SHA256SUMS)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --draft --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" release-assets/.env.example release-assets/* --clobber

  deploy-demo:
    needs: draft-release
    if: needs.draft-release.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: demo-deployment
      cancel-in-progress: false
    steps:
      - name: Configure pinned SSH host key
        env:
          DEMO_SSH_HOST_KEY: ${{ vars.DEMO_SSH_HOST_KEY }}
          DEMO_SSH_PRIVATE_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEMO_SSH_HOST_KEY"
          test -n "$DEMO_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEMO_SSH_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$DEMO_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts ~/.ssh/id_ed25519
      - name: Deploy fixed Tag
        env:
          DEMO_HOST: ${{ vars.DEMO_HOST }}
          DEMO_PORT: ${{ vars.DEMO_PORT }}
          DEMO_USER: ${{ vars.DEMO_USER }}
          DEMO_PATH: ${{ vars.DEMO_PATH }}
        run: |
          test -n "$DEMO_HOST" && test -n "$DEMO_USER" && test -n "$DEMO_PATH"
          [[ "$DEMO_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEMO_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${DEMO_PORT:-22}" =~ ^[0-9]+$ ]]
          [[ "$DEMO_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          ssh -i ~/.ssh/id_ed25519 -p "${DEMO_PORT:-22}" "${DEMO_USER}@${DEMO_HOST}" "cd '${DEMO_PATH}' && ./deploy-demo.sh '${GITHUB_REF_NAME}'"
      - name: Verify deployed version
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          test -n "$DEMO_URL"
          response="$(curl --fail --silent --show-error --max-time 15 "${DEMO_URL%/}/healthz")"
          RESPONSE="$response" EXPECTED="$GITHUB_REF_NAME" python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ["RESPONSE"]).get("data", {})
          sys.exit(0 if data.get("status") == "ok" and data.get("version") == os.environ["EXPECTED"] else 1)
          PY

  publish-release:
    needs: [draft-release, deploy-demo]
    if: needs.draft-release.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest=false
