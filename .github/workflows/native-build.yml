name: Native Linux Build
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      config:
        type: string
        default: deploy/linux/build.json
      go-version-file:
        type: string
        default: platform/go.mod
      go-sum-file:
        type: string
        default: platform/go.sum
      artifact-name:
        type: string
        default: native-release
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: ${{ inputs.go-sum-file }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Install native build tools
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential curl
      - uses: actions/cache@v4
        id: mupdf
        with:
          path: .cache/mupdf
          key: mupdf-ubuntu-22.04-amd64-1.28.2-${{ hashFiles('docker/build-mupdf-cjk.sh') }}
      - name: Build pinned MuPDF with CJK
        if: steps.mupdf.outputs.cache-hit != 'true'
        run: sh docker/build-mupdf-cjk.sh "$GITHUB_WORKSPACE/.cache/mupdf"
      - name: Build verified native package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_CONFIG: ${{ inputs.config }}
        run: |
          export CGO_ENABLED=1
          export CGO_CFLAGS="-I$GITHUB_WORKSPACE/.cache/mupdf/include"
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/.cache/mupdf/lib -lmupdf -lmupdf-third -lm"
          python3 scripts/deployment/package.py --config "$BUILD_CONFIG" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14
