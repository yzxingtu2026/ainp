name: Native Linux Build
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      config:
        type: string
        default: ""
      go-version-file:
        type: string
        default: ""
      go-sum-file:
        type: string
        default: ""
      artifact-name:
        type: string
        default: native-release
    secrets:
      private-module-token:
        required: false
      asset-store-key-id:
        required: false
      asset-store-key-secret:
        required: false
      asset-store-endpoint:
        required: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve project build contract
        id: project
        env:
          REQUESTED_CONFIG: ${{ inputs.config }}
          REQUESTED_GO_VERSION: ${{ inputs.go-version-file }}
          REQUESTED_GO_SUM: ${{ inputs.go-sum-file }}
        run: |
          python3 scripts/deployment/project.py
          python3 - <<'PY'
          import json, os
          cfg = json.load(open("deploy/linux/project.json"))
          build = json.load(open(cfg["build_config"]))
          for field, expected in (("REQUESTED_CONFIG", cfg["build_config"]), ("REQUESTED_GO_VERSION", build["go_dir"] + "/go.mod"), ("REQUESTED_GO_SUM", build["go_dir"] + "/go.sum")):
              assert not os.environ[field] or os.environ[field] == expected, field + " conflicts with project config"
          PY
      - name: Configure private Go module access
        env:
          GOPRIVATE: ${{ steps.project.outputs.go-private }}
          PRIVATE_MODULE_TOKEN: ${{ secrets.private-module-token }}
        run: |
          if [ -n "$GOPRIVATE" ] && [ -z "$PRIVATE_MODULE_TOKEN" ]; then
            echo "::error::project declares private Go modules but private-module-token was not provided"
            exit 1
          fi
          if [ -n "$GOPRIVATE" ]; then
            echo "GOPRIVATE=$GOPRIVATE" >> "$GITHUB_ENV"
            git config --global url."https://x-access-token:${PRIVATE_MODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.project.outputs.go-version-file }}
          cache-dependency-path: ${{ steps.project.outputs.go-sum-file }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.project.outputs.pnpm-version }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.project.outputs.node-version }}
      - name: Install native build tools
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential curl
      - uses: actions/cache@v4
        id: mupdf
        with:
          path: .cache/mupdf
          key: mupdf-ubuntu-22.04-amd64-1.28.2-${{ hashFiles('docker/build-mupdf-cjk.sh') }}
      - name: Build pinned MuPDF with CJK
        if: steps.mupdf.outputs.cache-hit != 'true'
        run: sh docker/build-mupdf-cjk.sh "$GITHUB_WORKSPACE/.cache/mupdf"
      - name: Install DVC OSS support for declared runtime assets
        if: steps.project.outputs.pre-build-hook-config != ''
        run: python3 -m pip install 'dvc[oss]==3.63.0' 'pathspec<1.0'
      - name: Fetch and verify declared runtime assets
        if: steps.project.outputs.pre-build-hook-config != ''
        env:
          AINP_ASSET_STORE_KEY_ID: ${{ secrets.asset-store-key-id }}
          AINP_ASSET_STORE_KEY_SECRET: ${{ secrets.asset-store-key-secret }}
          AINP_ASSET_STORE_ENDPOINT: ${{ secrets.asset-store-endpoint }}
          ASSET_CONFIG: ${{ steps.project.outputs.pre-build-hook-config }}
        run: |
          python3 scripts/deployment/fetch_runtime_assets.py --config "$ASSET_CONFIG"
      - name: Build verified native package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_CONFIG: ${{ steps.project.outputs.build-config }}
        run: |
          export CGO_ENABLED=1
          export CGO_CFLAGS="-I$GITHUB_WORKSPACE/.cache/mupdf/include"
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/.cache/mupdf/lib -lmupdf -lmupdf-third -lm"
          python3 scripts/deployment/package.py --config "$BUILD_CONFIG" --version "$RELEASE_VERSION"
      - name: Clean DVC workspace assets
        if: always() && steps.project.outputs.pre-build-hook-config != ''
        env:
          ASSET_CONFIG: ${{ steps.project.outputs.pre-build-hook-config }}
        run: python3 scripts/deployment/fetch_runtime_assets.py --config "$ASSET_CONFIG" --cleanup
      - name: Remove private module credentials
        if: always()
        env:
          GOPRIVATE: ${{ steps.project.outputs.go-private }}
          PRIVATE_MODULE_TOKEN: ${{ secrets.private-module-token }}
        run: |
          if [ -n "$GOPRIVATE" ]; then
            git config --global --unset-all "url.https://x-access-token:${PRIVATE_MODULE_TOKEN}@github.com/.insteadOf" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14
