server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256m;

    location = /healthz {
        proxy_pass http://api:8080;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/\.well-known/ {
        proxy_pass http://api:8080;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/oauth/ {
        proxy_pass http://api:8080;
        include /etc/nginx/proxy_params;
    }

    location = /mcp {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/v1/ai/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        include /etc/nginx/proxy_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
