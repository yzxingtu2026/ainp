server:
  addr: ":8080"
  mode: debug

database:
  # 按本地 Postgres 修改；勿将真实密钥提交到仓库
  dsn: "host=127.0.0.1 user=ainp password=ainp dbname=ainp port=5432 sslmode=disable TimeZone=UTC"

logging:
  level: info
  format: text # text | json
  outputs: [stdout] # 生产可设为 [stdout, file]；文件始终为 JSONL
  # service: api # API/Worker 启动时自动补齐，也可用 LOG_SERVICE 覆盖
  # instance_id: local-1 # 默认 hostname，也可用 INSTANCE_ID 覆盖
  file:
    path: data/logs/{service}.jsonl # API/独立 Worker 自动分文件；可用 LOG_FILE_PATH 覆盖
    max_size_mb: 100
    max_backups: 14
    max_age_days: 14
    compress: true

auth:
  # refresh token 会话有效期；仅保存摘要并在每次刷新时轮换
  refresh_ttl: 720h
  # 开发桩：Authorization: Bearer dev:<tenant_id>:<user_id>:<perm1,perm2,...>
  # 生产必须关闭；正式 JWT 优先
  dev_token_enabled: false
  jwt:
    # 生产务必更换为足够长的随机密钥；勿提交真实密钥
    secret: "change-me-dev-only-not-for-production"
    issuer: ainp
    ttl: 15m

mcp:
  # MCP/OAuth 后端对外公开的规范地址，用于 issuer、metadata、token 和 resource URL。
  # 生产必须配置为反向代理后的 HTTPS 公网地址，且不要带尾部斜杠。
  # 可通过环境变量 MCP_BASE_URL 覆盖。
  base_url: "http://127.0.0.1:8080"
  # Web 授权页地址；本地前后端分端口时指向前端，生产同域部署可与 base_url 相同。
  # 可通过环境变量 MCP_WEB_BASE_URL 覆盖。
  web_base_url: "http://127.0.0.1:9527"

i18n:
  # 未传 Accept-Language 时的默认语言；支持 zh-CN、en
  default_language: zh-CN
  # 翻译文件目录（相对于运行目录）；Agent 新增语言文件放此目录即可
  dir: i18n

ai:
  # 32 字节随机密钥的 Base64；生产建议通过 AI_CREDENTIAL_ENCRYPTION_KEY 注入
  credential_encryption_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

storage:
  # 对象存储 Provider：Phase 1 仅 local；S3/OSS 后续 Adapter
  provider: local
  local:
    # 本地对象根目录（相对运行目录或绝对路径）；勿提交真实生产路径密钥
    root_dir: data/objects

outbox:
  # Transactional Outbox（Issue #20）；省略 enabled 时默认开启
  enabled: true
  # Phase 1：postgres（进程内 Handler）；后续可换 redis Streams Adapter
  transport: postgres
  batch_size: 32
  poll_interval: 1s
  lock_timeout: 30s
  max_attempts: 10
  backoff_base: 1s
  backoff_max: 5m
  shutdown_timeout: 15s

redis:
  # Asynq / 任务队列 Redis（部署密钥走环境变量 REDIS_PASSWORD，勿提交真实密码）
  addr: "127.0.0.1:6379"
  db: 0
  username: ""
  password: ""
  pool_size: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

jobs:
  # Issue #21；省略 enabled 时默认关闭（无 Redis 也可启 HTTP）
  enabled: false
  concurrency: 10
  queues:
    critical: 6
    default: 3
    file: 2
    notification: 2
    ai: 1
  default_timeout: 5m
  max_payload_bytes: 262144
  shutdown_timeout: 30s
  recovery_interval: 30s
  # 开发可用 embedded_worker=true：HTTP 进程内嵌 Asynq Worker，无需另起 ainp-worker
  # 生产请保持 false，独立部署 cmd/ainp-worker 以便扩容
  embedded_worker: false
