server:
  addr: ":8080"
  mode: debug

database:
  # 按本地 Postgres 修改；勿将真实密钥提交到仓库
  dsn: "host=127.0.0.1 user=ainp password=ainp dbname=ainp port=5432 sslmode=disable TimeZone=UTC"

logging:
  level: info
  format: text # text | json

auth:
  # 开发桩：Authorization: Bearer dev:<tenant_id>:<user_id>:<perm1,perm2,...>
  # 生产必须关闭；正式 JWT 优先
  dev_token_enabled: false
  jwt:
    # 生产务必更换为足够长的随机密钥；勿提交真实密钥
    secret: "change-me-dev-only-not-for-production"
    issuer: ainp
    ttl: 24h

i18n:
  # 未传 Accept-Language 时的默认语言；支持 zh-CN、en
  default_language: zh-CN
