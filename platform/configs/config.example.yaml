server:
  addr: ":8080"
  mode: debug

database:
  # 按本地 Postgres 修改；勿将真实密钥提交到仓库
  dsn: "host=127.0.0.1 user=ainp password=ainp dbname=ainp port=5432 sslmode=disable TimeZone=UTC"

logging:
  level: info
  format: text # text | json

auth:
  # 开发桩：Authorization: Bearer dev:<tenant_id>:<user_id>:<perm1,perm2,...>
  # 生产必须关闭；正式 JWT 优先
  dev_token_enabled: false
  jwt:
    # 生产务必更换为足够长的随机密钥；勿提交真实密钥
    secret: "change-me-dev-only-not-for-production"
    issuer: ainp
    ttl: 24h

i18n:
  # 未传 Accept-Language 时的默认语言；支持 zh-CN、en
  default_language: zh-CN
  # 翻译文件目录（相对于运行目录）；Agent 新增语言文件放此目录即可
  dir: i18n

storage:
  # 对象存储 Provider：Phase 1 仅 local；S3/OSS 后续 Adapter
  provider: local
  local:
    # 本地对象根目录（相对运行目录或绝对路径）；勿提交真实生产路径密钥
    root_dir: data/objects

outbox:
  # Transactional Outbox（Issue #20）；省略 enabled 时默认开启
  enabled: true
  # Phase 1：postgres（进程内 Handler）；后续可换 redis Streams Adapter
  transport: postgres
  batch_size: 32
  poll_interval: 1s
  lock_timeout: 30s
  max_attempts: 10
  backoff_base: 1s
  backoff_max: 5m
  shutdown_timeout: 15s

redis:
  # Asynq / 任务队列 Redis（部署密钥走环境变量 REDIS_PASSWORD，勿提交真实密码）
  addr: "127.0.0.1:6379"
  db: 0
  username: ""
  password: ""
  pool_size: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

jobs:
  # Issue #21；省略 enabled 时默认关闭（无 Redis 也可启 HTTP）
  enabled: false
  concurrency: 10
  queues:
    critical: 6
    default: 3
    file: 2
    notification: 2
    ai: 1
  default_timeout: 5m
  max_payload_bytes: 262144
  shutdown_timeout: 30s
  recovery_interval: 30s
  # 开发可用 embedded_worker=true：HTTP 进程内嵌 Asynq Worker，无需另起 ainp-worker
  # 生产请保持 false，独立部署 cmd/ainp-worker 以便扩容
  embedded_worker: false
