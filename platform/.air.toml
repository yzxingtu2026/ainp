root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/ainp ./cmd/ainp"
bin = "./tmp/ainp"
args_bin = ["-config", "configs/config.yaml"]
delay = 800
exclude_dir = ["tmp", "vendor", "testdata", "configs"]
exclude_regex = ["_test\\.go"]
include_ext = ["go"]
kill_delay = "500ms"
send_interrupt = true
stop_on_error = false

[log]
time = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
